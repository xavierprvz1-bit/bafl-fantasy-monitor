<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="BAFL Fantasy Monitor — personal fantasy football command center." />
  <title>BAFL Fantasy Monitor</title>
  <style>
* { box-sizing: border-box; }
:root {
  --bg: #070b14;
  --bg2: #0b1020;
  --panel: #111827;
  --panel2: #172033;
  --line: rgba(255,255,255,.09);
  --text: #f7f9fc;
  --muted: #9da8bb;
  --accent: #77e1a6;
  --accent2: #7db6ff;
  --warn: #f4c75b;
  --danger: #ff7a86;
  --good: #77e1a6;
  --shadow: 0 12px 30px rgba(0,0,0,.24);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
html { background: var(--bg); color: var(--text); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 85% -10%, rgba(73,124,255,.18), transparent 34%),
    radial-gradient(circle at -10% 10%, rgba(60,218,148,.12), transparent 30%),
    linear-gradient(180deg, var(--bg2), var(--bg));
}
button, input, textarea { font: inherit; }
button { color: inherit; }
#app { max-width: 1180px; margin: 0 auto; padding: 18px 14px 48px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 2px 18px;
}
.eyebrow { color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .18em; }
h1 { margin: 3px 0 0; font-size: clamp(1.6rem, 5vw, 2.5rem); letter-spacing: -.04em; }
h2 { margin: 0; font-size: 1.05rem; letter-spacing: -.015em; }
h3 { margin: 0; font-size: .95rem; }
p { color: var(--muted); line-height: 1.5; }
.status-pill {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  border: 1px solid var(--line); background: rgba(17,24,39,.72);
  padding: 8px 11px; border-radius: 999px; color: var(--muted); font-size: .78rem;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 4px rgba(244,199,91,.12); }
.status-pill.live .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(119,225,166,.12); }

.tabs {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 12px; margin-bottom: 4px; position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, rgba(7,11,20,.96) 70%, rgba(7,11,20,0));
  backdrop-filter: blur(8px);
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: rgba(17,24,39,.72);
  padding: 9px 13px; border-radius: 10px; cursor: pointer; color: var(--muted);
}
.tab.active { color: var(--text); border-color: rgba(119,225,166,.35); background: rgba(119,225,166,.1); }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.card {
  background: linear-gradient(180deg, rgba(20,29,47,.96), rgba(14,21,35,.96));
  border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow);
}
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; }
.span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }
.metric { font-size: 1.8rem; font-weight: 800; letter-spacing: -.04em; margin-top: 8px; }
.label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.subtle { color: var(--muted); font-size: .82rem; }
.kpi-row { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px;
  font-size: .72rem; font-weight: 700; border: 1px solid var(--line); color: var(--muted);
}
.badge.good { color: var(--good); background: rgba(119,225,166,.08); border-color: rgba(119,225,166,.2); }
.badge.warn { color: var(--warn); background: rgba(244,199,91,.08); border-color: rgba(244,199,91,.2); }
.badge.danger { color: var(--danger); background: rgba(255,122,134,.08); border-color: rgba(255,122,134,.2); }
.badge.blue { color: var(--accent2); background: rgba(125,182,255,.08); border-color: rgba(125,182,255,.2); }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }

.list { display: grid; gap: 8px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.player-main { min-width: 0; }
.player-name { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-meta { color: var(--muted); font-size: .78rem; margin-top: 3px; }
.pos {
  display: inline-block; min-width: 29px; padding: 2px 5px; margin-right: 6px;
  border: 1px solid var(--line); border-radius: 6px; font-size: .68rem; text-align: center; color: var(--accent2);
}
.score { font-weight: 800; font-variant-numeric: tabular-nums; }
.score.muted { color: var(--muted); }
.reco { padding: 11px 12px; border-left: 3px solid var(--accent); background: rgba(119,225,166,.06); border-radius: 8px; }
.reco + .reco { margin-top: 8px; }
.reco.warn { border-color: var(--warn); background: rgba(244,199,91,.06); }
.reco.danger { border-color: var(--danger); background: rgba(255,122,134,.06); }

.progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; margin: 10px 0 4px; }
.progress > span { display:block; height:100%; border-radius:inherit; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 50%; }

.table-wrap { overflow-x: auto; }
table { width:100%; border-collapse: collapse; min-width: 620px; }
th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: .82rem; }
th { color: var(--muted); font-weight: 650; }
tr:last-child td { border-bottom:0; }

.controls { display:flex; flex-wrap:wrap; gap:8px; }
.btn {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor:pointer;
  background: rgba(255,255,255,.04); color: var(--text); font-weight: 700;
}
.btn.primary { background: var(--accent); color: #07110c; border-color: transparent; }
.btn.secondary { background: rgba(125,182,255,.1); color: var(--accent2); border-color: rgba(125,182,255,.22); }
.btn.danger { background: rgba(255,122,134,.09); color: var(--danger); border-color: rgba(255,122,134,.2); }
.btn:active { transform: translateY(1px); }

.field { display:grid; gap:6px; margin-bottom:12px; }
.field label { color: var(--muted); font-size:.78rem; font-weight:700; }
.field input, .field textarea {
  width:100%; border:1px solid var(--line); background:#0b1220; color:var(--text);
  border-radius:10px; padding:11px 12px; outline:none;
}
.field textarea { min-height: 220px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78rem; line-height:1.5; }
.field input:focus, .field textarea:focus { border-color: rgba(125,182,255,.5); box-shadow:0 0 0 3px rgba(125,182,255,.08); }
.help { color:var(--muted); font-size:.76rem; line-height:1.5; }
.toast {
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:#111827; border:1px solid var(--line); padding:10px 14px; border-radius:10px;
  box-shadow:var(--shadow); z-index:50; font-size:.82rem;
}
.empty { text-align:center; padding:34px 18px; }

.report-body h3 { margin: 16px 0 6px; color: var(--accent); }
.report-body p { margin: 0 0 10px; }
.report-body ul { color: var(--muted); line-height: 1.55; padding-left: 20px; }

@media (max-width: 850px) {
  .span-3, .span-4 { grid-column: span 6; }
  .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
}
@media (max-width: 560px) {
  #app { padding: 12px 10px 40px; }
  .topbar { align-items:flex-start; }
  .status-pill { margin-top:3px; }
  .grid { gap:10px; }
  .card { padding:14px; border-radius:14px; }
  .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
  .metric { font-size:1.6rem; }
}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">BAFL</div>
        <h1>Fantasy Monitor</h1>
      </div>
      <div class="status-pill" id="syncStatus">
        <span class="dot"></span>
        <span>Manual mode</span>
      </div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="roster">Roster</button>
      <button class="tab" data-view="waivers">Waivers</button>
      <button class="tab" data-view="league">League</button>
      <button class="tab" data-view="reports">Reports</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>

    <main id="view"></main>
  </div>

  <template id="emptyState">
    <section class="card empty">
      <h2>No data yet</h2>
      <p>Import a BAFL update in Settings to populate this screen.</p>
    </section>
  </template>

  <script>
(() => {
  "use strict";

  const STORAGE_KEY = "baflFantasyMonitorState.v1";
  const API_KEY = "baflFantasyMonitorApiUrl.v1";

  const blank = {
    meta: {
      leagueName: "BAFL",
      teamName: "My Team",
      season: 2026,
      week: null,
      updatedAt: null,
      source: "manual"
    },
    league: {
      teamCount: null,
      scoring: "Full PPR",
      record: null,
      rank: null,
      pointsFor: null,
      waiverPriority: null
    },
    matchup: null,
    roster: [],
    waivers: [],
    transactions: [],
    standings: [],
    recommendations: {
      lineup: [],
      waivers: [],
      trades: [],
      watch: []
    },
    reports: []
  };

  const sample = {
    meta: {
      leagueName: "BAFL",
      teamName: "Demo Team",
      season: 2026,
      week: 1,
      updatedAt: new Date().toISOString(),
      source: "sample"
    },
    league: {
      teamCount: 12,
      scoring: "Full PPR",
      record: "0-0",
      rank: 5,
      pointsFor: 0,
      waiverPriority: 6
    },
    matchup: {
      opponent: "Sample Opponent",
      projectedFor: 121.6,
      projectedAgainst: 117.9,
      winProbability: 56
    },
    roster: [
      { name: "Sample QB", pos: "QB", nfl: "NFL", slot: "QB", proj: 21.4, status: "OK" },
      { name: "Sample RB 1", pos: "RB", nfl: "NFL", slot: "RB", proj: 17.2, status: "OK" },
      { name: "Sample RB 2", pos: "RB", nfl: "NFL", slot: "RB", proj: 14.8, status: "Q" },
      { name: "Sample WR 1", pos: "WR", nfl: "NFL", slot: "WR", proj: 18.1, status: "OK" },
      { name: "Sample WR 2", pos: "WR", nfl: "NFL", slot: "WR", proj: 15.9, status: "OK" },
      { name: "Sample TE", pos: "TE", nfl: "NFL", slot: "TE", proj: 10.3, status: "OK" },
      { name: "Sample FLEX", pos: "WR", nfl: "NFL", slot: "FLEX", proj: 13.9, status: "OK" },
      { name: "Sample FLEX 2", pos: "RB", nfl: "NFL", slot: "FLEX", proj: 12.6, status: "OK" }
    ],
    waivers: [
      { name: "Sample Breakout WR", pos: "WR", nfl: "NFL", action: "ADD", priority: 1, faab: "8–12%", note: "High-upside target; role is expanding." },
      { name: "Sample Handcuff RB", pos: "RB", nfl: "NFL", action: "WATCH", priority: 2, faab: "2–4%", note: "Useful contingency value." }
    ],
    transactions: [
      { time: "Sample", team: "League Team", type: "ADD", player: "Sample Player" }
    ],
    standings: [
      { rank: 1, team: "Sample Leader", record: "0-0", points: 0 },
      { rank: 5, team: "Demo Team", record: "0-0", points: 0 }
    ],
    recommendations: {
      lineup: ["This is sample data. Import a BAFL update before making a lineup decision."],
      waivers: ["Use the waiver screen as the priority queue once real BAFL data is loaded."],
      trades: ["Trade analysis will appear here when a recommendation is included in the import."],
      watch: ["Yahoo live sync is not connected yet."]
    },
    reports: [{
      title: "Demo BAFL Report",
      createdAt: new Date().toISOString(),
      summary: "Sample report only. Replace it with a manual BAFL update or future Yahoo sync.",
      sections: [
        { title: "Roster", bullets: ["No real roster data loaded."] },
        { title: "Waivers", bullets: ["No real waiver data loaded."] }
      ]
    }]
  };

  let state = loadState();
  let currentView = "dashboard";

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return clone(blank);
      return normalize(JSON.parse(raw));
    } catch (e) {
      console.error("State load failed:", e);
      return clone(blank);
    }
  }

  function normalize(input) {
    const base = clone(blank);
    const merged = {
      ...base,
      ...input,
      meta: { ...base.meta, ...(input.meta || {}) },
      league: { ...base.league, ...(input.league || {}) },
      recommendations: { ...base.recommendations, ...(input.recommendations || {}) }
    };
    ["roster","waivers","transactions","standings","reports"].forEach(k => {
      if (!Array.isArray(merged[k])) merged[k] = [];
    });
    Object.keys(base.recommendations).forEach(k => {
      if (!Array.isArray(merged.recommendations[k])) merged.recommendations[k] = [];
    });
    return merged;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function fmtNum(v, digits = 1) {
    if (v === null || v === undefined || v === "") return "—";
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(digits) : esc(v);
  }

  function fmtDate(v) {
    if (!v) return "Never";
    const d = new Date(v);
    return Number.isNaN(d.valueOf()) ? esc(v) : d.toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
  }

  function badge(text, kind = "") {
    return `<span class="badge ${kind}">${esc(text)}</span>`;
  }

  function statusKind(status) {
    const s = String(status || "").toUpperCase();
    if (["OUT","IR","D"].includes(s)) return "danger";
    if (["Q","QUESTIONABLE","PUP"].includes(s)) return "warn";
    return "good";
  }

  function render() {
    updateStatus();
    $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === currentView));
    const view = $("#view");
    const routes = { dashboard, roster, waivers, league, reports, settings };
    view.innerHTML = routes[currentView]();
    wireView();
  }

  function updateStatus() {
    const el = $("#syncStatus");
    const isLive = state.meta.source === "api";
    el.classList.toggle("live", isLive);
    el.innerHTML = `<span class="dot"></span><span>${isLive ? "API synced" : state.meta.source === "sample" ? "Sample mode" : "Manual mode"}</span>`;
  }

  function dashboard() {
    const m = state.matchup;
    const injuries = state.roster.filter(p => statusKind(p.status) !== "good").length;
    const win = m?.winProbability ?? null;
    const pf = state.league.pointsFor;
    const rank = state.league.rank;

    return `
      <div class="grid">
        <section class="card span-3">
          <div class="label">Record</div>
          <div class="metric">${esc(state.league.record ?? "—")}</div>
          <div class="subtle">${rank ? `League rank #${esc(rank)}` : "Rank unavailable"}</div>
        </section>
        <section class="card span-3">
          <div class="label">Points For</div>
          <div class="metric">${pf == null ? "—" : fmtNum(pf,1)}</div>
          <div class="subtle">${esc(state.league.scoring || "Scoring")}</div>
        </section>
        <section class="card span-3">
          <div class="label">Waiver Priority</div>
          <div class="metric">${state.league.waiverPriority ? `#${esc(state.league.waiverPriority)}` : "—"}</div>
          <div class="subtle">${state.waivers.length} player${state.waivers.length === 1 ? "" : "s"} on watch list</div>
        </section>
        <section class="card span-3">
          <div class="label">Roster Alerts</div>
          <div class="metric">${injuries}</div>
          <div class="subtle">${injuries ? "Status flags need review" : "No player status flags"}</div>
        </section>

        <section class="card span-7">
          <div class="section-head">
            <div>
              <div class="label">This Week</div>
              <h2>${m ? `${esc(state.meta.teamName)} vs ${esc(m.opponent)}` : "Matchup"}</h2>
            </div>
            ${win == null ? badge("No projection","warn") : badge(`${fmtNum(win,0)}% win`, win >= 55 ? "good" : win >= 45 ? "warn" : "danger")}
          </div>
          ${m ? `
            <div class="kpi-row">
              <div><div class="subtle">${esc(state.meta.teamName)}</div><div class="metric">${fmtNum(m.projectedFor,1)}</div></div>
              <div style="text-align:right"><div class="subtle">${esc(m.opponent)}</div><div class="metric">${fmtNum(m.projectedAgainst,1)}</div></div>
            </div>
            <div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(win)||50))}%"></span></div>
            <div class="subtle">Projected matchup edge</div>
          ` : `<p>No matchup data loaded yet.</p>`}
        </section>

        <section class="card span-5">
          <div class="section-head"><h2>Immediate Actions</h2>${badge(`Week ${state.meta.week ?? "—"}`,"blue")}</div>
          ${recommendationList([
            ...(state.recommendations.lineup || []).slice(0,2),
            ...(state.recommendations.waivers || []).slice(0,2)
          ])}
        </section>

        <section class="card span-6">
          <div class="section-head"><h2>Top Waiver Targets</h2><button class="btn" data-go="waivers">View all</button></div>
          ${state.waivers.length ? state.waivers.slice(0,5).map(waiverRow).join("") : `<p>No waiver targets loaded.</p>`}
        </section>

        <section class="card span-6">
          <div class="section-head"><h2>Recent Transactions</h2><span class="subtle">Updated ${fmtDate(state.meta.updatedAt)}</span></div>
          ${state.transactions.length ? state.transactions.slice(0,6).map(t => `
            <div class="row">
              <div><div class="player-name">${esc(t.team || "League")}</div><div class="player-meta">${esc(t.type || "MOVE")} · ${esc(t.player || "")}</div></div>
              <div class="subtle">${esc(t.time || "")}</div>
            </div>`).join("") : `<p>No transactions loaded.</p>`}
        </section>
      </div>`;
  }

  function roster() {
    if (!state.roster.length) return empty();
    const starters = state.roster.filter(p => String(p.slot || "").toUpperCase() !== "BN");
    const bench = state.roster.filter(p => String(p.slot || "").toUpperCase() === "BN");
    return `
      <div class="grid">
        <section class="card span-8">
          <div class="section-head"><h2>${esc(state.meta.teamName)} Roster</h2>${badge(`${state.roster.length} players`,"blue")}</div>
          <div class="list">${starters.map(rosterRow).join("")}</div>
        </section>
        <section class="card span-4">
          <div class="section-head"><h2>Lineup Notes</h2></div>
          ${recommendationList(state.recommendations.lineup)}
        </section>
        <section class="card span-12">
          <div class="section-head"><h2>Bench</h2></div>
          ${bench.length ? `<div class="list">${bench.map(rosterRow).join("")}</div>` : `<p>No bench players identified.</p>`}
        </section>
      </div>`;
  }

  function rosterRow(p) {
    return `<div class="row">
      <div class="player-main">
        <div class="player-name"><span class="pos">${esc(p.pos || "?")}</span>${esc(p.name)}</div>
        <div class="player-meta">${esc(p.nfl || "")} · ${esc(p.slot || "Roster")} ${p.status && p.status !== "OK" ? `· ${badge(p.status,statusKind(p.status))}` : ""}</div>
      </div>
      <div style="text-align:right">
        <div class="score">${fmtNum(p.proj,1)}</div>
        <div class="subtle">proj</div>
      </div>
    </div>`;
  }

  function waivers() {
    return `
      <div class="grid">
        <section class="card span-8">
          <div class="section-head"><h2>Waiver / Free-Agent Board</h2>${badge(`${state.waivers.length} targets`,"blue")}</div>
          ${state.waivers.length ? state.waivers.map(waiverRow).join("") : `<p>No waiver targets loaded.</p>`}
        </section>
        <section class="card span-4">
          <div class="section-head"><h2>Waiver Strategy</h2></div>
          ${recommendationList(state.recommendations.waivers)}
        </section>
        <section class="card span-12">
          <div class="section-head"><h2>Trade / Watch Notes</h2></div>
          ${recommendationList([...(state.recommendations.trades||[]), ...(state.recommendations.watch||[])])}
        </section>
      </div>`;
  }

  function waiverRow(p) {
    const kind = String(p.action || "").toUpperCase() === "ADD" ? "good" : "warn";
    return `<div class="row">
      <div class="player-main">
        <div class="player-name"><span class="pos">${esc(p.pos || "?")}</span>${esc(p.name)}</div>
        <div class="player-meta">${esc(p.nfl || "")}${p.note ? ` · ${esc(p.note)}` : ""}</div>
      </div>
      <div style="text-align:right">
        ${badge(p.action || "WATCH", kind)}
        <div class="subtle" style="margin-top:5px">${p.faab ? `FAAB ${esc(p.faab)}` : `Priority ${esc(p.priority ?? "—")}`}</div>
      </div>
    </div>`;
  }

  function league() {
    return `
      <div class="grid">
        <section class="card span-7">
          <div class="section-head"><h2>Standings</h2>${badge(state.meta.leagueName || "BAFL","blue")}</div>
          ${state.standings.length ? `
          <div class="table-wrap"><table>
            <thead><tr><th>#</th><th>Team</th><th>Record</th><th>Points</th></tr></thead>
            <tbody>${state.standings.map(s => `<tr>
              <td>${esc(s.rank ?? "—")}</td>
              <td><strong>${esc(s.team)}</strong></td>
              <td>${esc(s.record ?? "—")}</td>
              <td>${s.points == null ? "—" : fmtNum(s.points,1)}</td>
            </tr>`).join("")}</tbody>
          </table></div>` : `<p>No standings loaded.</p>`}
        </section>
        <section class="card span-5">
          <div class="section-head"><h2>League Snapshot</h2></div>
          <div class="list">
            <div class="row"><span class="subtle">Season</span><strong>${esc(state.meta.season)}</strong></div>
            <div class="row"><span class="subtle">Week</span><strong>${esc(state.meta.week ?? "—")}</strong></div>
            <div class="row"><span class="subtle">Teams</span><strong>${esc(state.league.teamCount ?? "—")}</strong></div>
            <div class="row"><span class="subtle">Scoring</span><strong>${esc(state.league.scoring ?? "—")}</strong></div>
            <div class="row"><span class="subtle">Last update</span><strong>${fmtDate(state.meta.updatedAt)}</strong></div>
          </div>
        </section>
        <section class="card span-12">
          <div class="section-head"><h2>League Transactions</h2></div>
          ${state.transactions.length ? state.transactions.map(t => `
            <div class="row">
              <div><div class="player-name">${esc(t.player || "")}</div><div class="player-meta">${esc(t.team || "")} · ${esc(t.type || "")}</div></div>
              <div class="subtle">${esc(t.time || "")}</div>
            </div>`).join("") : `<p>No transactions loaded.</p>`}
        </section>
      </div>`;
  }

  function reports() {
    return `
      <div class="grid">
        <section class="card span-12">
          <div class="section-head">
            <div><div class="label">BAFL Intelligence</div><h2>Reports</h2></div>
            ${badge(`${state.reports.length} saved`,"blue")}
          </div>
          ${state.reports.length ? state.reports.map((r,i) => `
            <article class="report-body" style="${i ? "border-top:1px solid var(--line); margin-top:18px; padding-top:18px" : ""}">
              <div class="section-head"><h2>${esc(r.title || `Report ${i+1}`)}</h2><span class="subtle">${fmtDate(r.createdAt)}</span></div>
              ${r.summary ? `<p>${esc(r.summary)}</p>` : ""}
              ${(r.sections || []).map(s => `
                <h3>${esc(s.title || "Notes")}</h3>
                ${s.text ? `<p>${esc(s.text)}</p>` : ""}
                ${Array.isArray(s.bullets) && s.bullets.length ? `<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>` : ""}
              `).join("")}
            </article>`).join("") : `<p>No reports loaded.</p>`}
        </section>
      </div>`;
  }

  function settings() {
    const api = localStorage.getItem(API_KEY) || "";
    return `
      <div class="grid">
        <section class="card span-7">
          <div class="section-head"><div><div class="label">Until Yahoo is connected</div><h2>Import BAFL Update</h2></div></div>
          <p>Paste a JSON update here. It will be saved on this device and survive normal refreshes/reopens.</p>
          <div class="field">
            <label for="jsonImport">BAFL JSON</label>
            <textarea id="jsonImport" spellcheck="false" placeholder='{"meta":{"leagueName":"BAFL","teamName":"..."}, ...}'></textarea>
          </div>
          <div class="controls">
            <button class="btn primary" id="importBtn">Import Update</button>
            <button class="btn secondary" id="sampleBtn">Load Sample Data</button>
            <button class="btn" id="exportBtn">Copy Current JSON</button>
          </div>
          <p class="help">Importing replaces the current dashboard data but does not change the app code.</p>
        </section>

        <section class="card span-5">
          <div class="section-head"><div><div class="label">Future live feed</div><h2>API Connection</h2></div>${badge("Yahoo pending","warn")}</div>
          <p>The GitHub Pages site should never contain a Yahoo client secret. When Yahoo access is ready, the app can call a small secure backend endpoint instead.</p>
          <div class="field">
            <label for="apiUrl">BAFL API endpoint</label>
            <input id="apiUrl" type="url" placeholder="https://your-backend.example/api/bafl" value="${esc(api)}" />
          </div>
          <div class="controls">
            <button class="btn secondary" id="saveApiBtn">Save Endpoint</button>
            <button class="btn primary" id="syncApiBtn">Sync Now</button>
          </div>
          <p class="help">Leave this blank for now. It is already wired for the backend step later.</p>
        </section>

        <section class="card span-12">
          <div class="section-head"><h2>Local Data</h2></div>
          <div class="controls">
            <button class="btn" id="downloadBtn">Download Backup</button>
            <button class="btn danger" id="clearBtn">Clear Local Data</button>
          </div>
          <p class="help">Current source: <strong>${esc(state.meta.source)}</strong> · Last updated: <strong>${fmtDate(state.meta.updatedAt)}</strong></p>
        </section>
      </div>`;
  }

  function recommendationList(items) {
    if (!items || !items.length) return `<p>No recommendations loaded.</p>`;
    return items.map((x,i) => `<div class="reco ${i === 1 ? "warn" : ""}">${esc(x)}</div>`).join("");
  }

  function empty() {
    return `<section class="card empty"><h2>No data yet</h2><p>Import a BAFL update in Settings to populate this screen.</p><button class="btn primary" data-go="settings">Open Settings</button></section>`;
  }

  function wireView() {
    $$("[data-go]").forEach(btn => btn.addEventListener("click", () => {
      currentView = btn.dataset.go;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    }));

    $("#importBtn")?.addEventListener("click", () => {
      try {
        const text = $("#jsonImport").value.trim();
        if (!text) throw new Error("Paste BAFL JSON first.");
        const parsed = JSON.parse(text);
        state = normalize(parsed);
        state.meta.updatedAt = state.meta.updatedAt || new Date().toISOString();
        state.meta.source = state.meta.source || "manual";
        persist();
        toast("BAFL update imported.");
        currentView = "dashboard";
        render();
      } catch (e) {
        toast(`Import failed: ${e.message}`);
      }
    });

    $("#sampleBtn")?.addEventListener("click", () => {
      state = normalize(sample);
      state.meta.updatedAt = new Date().toISOString();
      persist();
      toast("Sample BAFL data loaded.");
      render();
    });

    $("#exportBtn")?.addEventListener("click", async () => {
      const text = JSON.stringify(state, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        toast("Current BAFL JSON copied.");
      } catch {
        $("#jsonImport").value = text;
        toast("Clipboard blocked. JSON placed in the box.");
      }
    });

    $("#saveApiBtn")?.addEventListener("click", () => {
      localStorage.setItem(API_KEY, $("#apiUrl").value.trim());
      toast("API endpoint saved.");
    });

    $("#syncApiBtn")?.addEventListener("click", syncApi);

    $("#downloadBtn")?.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `bafl-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    $("#clearBtn")?.addEventListener("click", () => {
      if (!confirm("Clear all locally saved BAFL dashboard data on this device?")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = clone(blank);
      render();
      toast("Local BAFL data cleared.");
    });
  }

  async function syncApi() {
    const url = ($("#apiUrl")?.value || localStorage.getItem(API_KEY) || "").trim();
    if (!url) return toast("Add the BAFL API endpoint first.");
    try {
      toast("Syncing BAFL data…");
      const res = await fetch(url, { headers: { "Accept":"application/json" } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const parsed = await res.json();
      state = normalize(parsed);
      state.meta.updatedAt = new Date().toISOString();
      state.meta.source = "api";
      persist();
      currentView = "dashboard";
      render();
      toast("BAFL synced.");
    } catch (e) {
      console.error(e);
      toast(`Sync failed: ${e.message}`);
    }
  }

  function toast(message) {
    $(".toast")?.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  $$(".tab").forEach(t => t.addEventListener("click", () => {
    currentView = t.dataset.view;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  }));

  render();
})();

</script>
</body>
</html>
